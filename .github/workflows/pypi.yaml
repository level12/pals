name: PyPI publish

on:
  pull_request:
    paths:
      - '.github/workflows/pypi.yaml'
  push:
    tags:
      - 'v*.*.*'


jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Build and validate wheel and sdist
        uses: level12/coppy/gh-actions/nox-run@main
        env:
          PALS_DIST_DIR: dist
        with:
          nox-session: build

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi-publish
      url: https://pypi.org/p/pals

    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
