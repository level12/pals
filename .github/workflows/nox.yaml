name: Nox

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:


# Limit this workflow to a single run at a time per-branch to avoid wasting worker resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # JOB
  nox-other:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        session: [audit, build, prek]

    steps:
      - uses: level12/coppy/gh-actions/nox-run@main
        with:
          nox-session: ${{ matrix.session }}

  # JOB
  nox-pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PALS_DB_URL: postgresql://postgres:password@localhost:5432/postgres

    # Specifying the permissions block sets anything not-specified to `none` so we have have to
    # re-specify the default read permission to be able to set the write permission.
    permissions:
      contents: read    # For actions/checkout
      id-token: write   # For codecov OIDC

    steps:
      - uses: level12/coppy/gh-actions/nox-run@main
        with:
          nox-session: pytest

      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
